name: MagicNuke

on:
  push:
    paths:
      - 'MagicNuke/**'
      - '.github/workflows/magicnuke.yml'
  pull_request:
    paths:
      - 'MagicNuke/**'
      - '.github/workflows/magicnuke.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: ./gradlew -p MagicNuke build --no-daemon

      - name: Upload plugin jar and resource pack
        uses: actions/upload-artifact@v4
        with:
          name: MagicNuke
          path: MagicNuke/build/dist/*
          if-no-files-found: error

      - name: Smoke test on a real Paper server
        run: bash MagicNuke/tools/smoke-test.sh MagicNuke/build/dist/MagicNuke-*.jar

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: smoke-server/server.log
          if-no-files-found: ignore
