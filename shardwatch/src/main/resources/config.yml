# ╔══════════════════════════════════════════════════════════════════╗
# ║                     ✦  S H A R D W A T C H  ✦                    ║
# ║              crystal staff suite for Paper 1.21.11               ║
# ╚══════════════════════════════════════════════════════════════════╝
# Durations everywhere: 30s, 10m, 2h, 7d, 2w, 1mo, 1y — combine like 1d12h. "perm" = never ends.
# Text uses MiniMessage. Palette tags: <pink> <rose> <teal> <ice> <muted> <ok> <bad>.
# Run /sw reload after editing.

storage:
  file: shardwatch.db
  # Old rows are pruned every 6 hours. "perm" keeps them forever.
  retention:
    echoes: 30d
    chat: 14d
    audit: perm

# ─────────────────────────────────────────────────────────── Verdicts
verdicts:
  default-reason: "No reason given"
  require-reason: true
  # Optional link shown on the Encase screen.
  appeal-url: ""
  # Who sees a verdict announcement: all | staff | none. "-s" always makes it staff-only.
  broadcast:
    chip: staff
    hush: staff
    eject: all
    encase: all
    petrify: staff
  # Write "#id" as the reason to use one of these.
  reason-presets:
    spam: "Spamming chat"
    toxic: "Toxic or abusive language"
    grief: "Griefing"
    xray: "X-ray / ore ESP"
    hacks: "Unfair client modifications"
    ads: "Advertising other servers"
  hush:
    default-duration: 30m
    max-duration: 30d
    blocked-commands: [msg, tell, w, whisper, r, reply, me, say, mail]
  encase:
    default-duration: perm
    max-duration: perm
    # Ticks between the Encase animation starting and the kick.
    kick-delay-ticks: 30
    # Refuse logins when the database can't be read (true) or let them in (false).
    fail-closed: false
  petrify:
    reason: "Held for questioning"
    persist: true
    allow-falling: true
    invulnerable: true
    allowed-commands: [msg, tell, r, reply, hum, flare, report]

ledger:
  chat-page-size: 8

# ─────────────────────────────────────────────────────────── Flares
flares:
  cooldown-seconds: 60
  min-reason-length: 0
  max-reason-length: 200
  allow-duplicates: false
  notify-reporter: true
  teleport-to-target: true
  categories:
    hacking:
      name: "<rose>Unfair Client"
      icon: flare_hacking
      description: ["<muted>Fly, reach, kill aura, x-ray…"]
    griefing:
      name: "<pink>Griefing"
      icon: flare_griefing
      description: ["<muted>Broke or stole from builds"]
    chat:
      name: "<teal>Chat Abuse"
      icon: flare_chat
      description: ["<muted>Spam, slurs, harassment"]
    exploit:
      name: "<ice>Exploit"
      icon: flare_exploit
      description: ["<muted>Dupes, glitches, lag machines"]
    other:
      name: "<muted>Something Else"
      icon: flare_other
      description: ["<muted>Tell us in your own words"]

# ─────────────────────────────────────────────────────────── Echoes & Rewind
echoes:
  enabled: true
  disabled-worlds: []
  ignored-blocks: [SHORT_GRASS, TALL_GRASS, FIRE, SOUL_FIRE, SNOW]
  # Non-player mobs whose block changes are logged as #<type>.
  log-entities: [enderman, wither, ravager, silverfish]
  inspect-page-size: 7

rewind:
  default-radius: 15
  max-radius: 60
  max-time: 14d
  max-blocks: 50000
  blocks-per-tick: 400
  # Only restore blocks that still look the way the logged change left them.
  only-matching: true
  undo-depth: 5
  preview-seconds: 10

# ─────────────────────────────────────────────────────────── Glint (x-ray)
glint:
  enabled: true
  disabled-worlds: []
  window-minutes: 15
  # Alert when score ≥ threshold and the player found at least min-veins veins in the window.
  threshold: 40
  min-veins: 3
  # The divisor never drops below this many mined blocks (stops tiny samples spiking).
  min-sample: 60
  # Ores within 2 blocks of the same ore type mined in this many seconds are one vein.
  vein-seconds: 60
  # Multiplier for ores that had at most one open face when mined.
  hidden-bonus: 1.5
  alert-cooldown-seconds: 120
  ores:
    DIAMOND_ORE: 10
    DEEPSLATE_DIAMOND_ORE: 10
    ANCIENT_DEBRIS: 14
    EMERALD_ORE: 8
    DEEPSLATE_EMERALD_ORE: 8
    GOLD_ORE: 3
    DEEPSLATE_GOLD_ORE: 3
    NETHER_GOLD_ORE: 1
    LAPIS_ORE: 2
    DEEPSLATE_LAPIS_ORE: 2
  counted-blocks: [STONE, DEEPSLATE, TUFF, GRANITE, DIORITE, ANDESITE, CALCITE, NETHERRACK, BASALT, BLACKSTONE,
                   COBBLED_DEEPSLATE, SMOOTH_BASALT, DRIPSTONE_BLOCK, GRAVEL, DIRT]

# ─────────────────────────────────────────────────────────── Facets (staff ranks)
facets:
  # Grant each rank's permissions through Shardwatch. Turn off if LuckPerms manages them;
  # then give players shardwatch.facet.<id> instead.
  grant-permissions: true
  # Higher ranks also get every lower rank's permissions.
  inherit: true
  chat-format:
    enabled: true
    format: "<sigil><facet_prefix> <name_color><name></name_color> <muted>»</muted> <white><message>"
  ranks:
    shardling:
      name: "<#7FE8E0>Shardling"
      weight: 10
      color: "#7FE8E0"
      prefix: "<#7FE8E0>[<b>Shardling</b>]"
      sigil: "shardling"
      permissions:
        - shardwatch.flares
        - shardwatch.flares.handle
        - shardwatch.verdict.chip
        - shardwatch.hum
        - shardwatch.scope
        - shardwatch.notify.flares
        - shardwatch.ledger
        - shardwatch.kit
        - shardwatch.tool.flare_compass
        - shardwatch.tool.verdict_gavel
    prismkeeper:
      name: "<#F59AC8>Prismkeeper"
      weight: 20
      color: "#F59AC8"
      prefix: "<#F59AC8>[<b>Prismkeeper</b>]"
      sigil: "prismkeeper"
      permissions:
        - shardwatch.verdict.hush
        - shardwatch.verdict.hush.revoke
        - shardwatch.verdict.eject
        - shardwatch.verdict.petrify
        - shardwatch.flares.teleport
        - shardwatch.echo
        - shardwatch.veil
        - shardwatch.veil.see
        - shardwatch.scope.blocks
        - shardwatch.scope.chat
        - shardwatch.scope.teleport
        - shardwatch.notify.verdicts
        - shardwatch.tool.echo_lens
        - shardwatch.tool.petrify_prism
        - shardwatch.tool.veil_lantern
    lumenwarden:
      name: "<#B7F2FF>Lumenwarden"
      weight: 30
      color: "#B7F2FF"
      prefix: "<#B7F2FF>[<b>Lumenwarden</b>]"
      sigil: "lumenwarden"
      permissions:
        - shardwatch.verdict.encase
        - shardwatch.verdict.encase.revoke
        - shardwatch.verdict.hush.permanent
        - shardwatch.ledger.revoke
        - shardwatch.rewind
        - shardwatch.glint
        - shardwatch.glint.watch
        - shardwatch.notify.glint
        - shardwatch.facet.manage
        - shardwatch.scope.staff
        - shardwatch.tool.timeglass
        - shardwatch.tool.glint_monocle
    crownfacet:
      name: "<gradient:#FFC7E6:#7FE8E0>Crownfacet</gradient>"
      weight: 40
      color: "#FFC7E6"
      prefix: "<gradient:#FFC7E6:#7FE8E0>[<b>Crownfacet</b>]</gradient>"
      sigil: "crownfacet"
      permissions:
        - shardwatch.*

  # Give the new rank's sigil badge when someone is promoted.
  give-sigil: true
  # Show a crystal glyph (shardwatch:sigils font) before staff names in chat. Needs the resource pack.
  chat-sigils: true

# ─────────────────────────────────────────────────────────── Staff tools
tools:
  # Every tool is this item with its own item_model, so no vanilla item is replaced.
  # Players without the pack see an amethyst shard.
  base-material: AMETHYST_SHARD
  prevent-drop: true
  prevent-storing: true
  keep-on-death: true
  # Take tools away from players who lost the permission to use them.
  remove-from-unauthorised: true
  echo_lens:
    cooldown-ticks: 6
  timeglass:
    # Cooldown after an area rewind; the Timeglass model drains while it runs.
    cooldown-ticks: 100
    presets: [10m, 1h, 6h, 1d, 3d]
  verdict_gavel:
    cooldown-ticks: 10
  petrify_prism:
    cooldown-ticks: 20
  veil_lantern:
    cooldown-ticks: 20
  flare_compass:
    cooldown-ticks: 20
    refresh-ticks: 200
    claim-on-warp: true
  glint_monocle:
    cooldown-ticks: 20

# ─────────────────────────────────────────────────────────── Menus
gui:
  # Menus for /sw, /flares, /flare <player>, /ledger, /glint and the Verdict Gavel. Off = chat views.
  enabled: true
  # Crystal panel drawn behind chest menus with the "shardwatch:gui" font. Needs the resource pack.
  custom-backgrounds: true
  # The "shardwatch:crystal" tooltip frame on every icon and tool.
  tooltip-style: true
  # Fill empty slots with the crystal background tile.
  filler: true
  prompt-seconds: 60
  durations:
    hush: [10m, 30m, 1h, 6h, 1d, 7d, perm]
    encase: [1h, 1d, 3d, 7d, 14d, 30d, perm]
  flare-outcomes: ["Handled", "Verdict issued", "Rolled back"]
  rewind:
    sources: ["*", "#tnt", "#creeper", "#fire", "#enderman"]
    times: [10m, 30m, 1h, 6h, 1d, 3d, 7d]
    radii: [5, 10, 15, 25, 40, 60]

# ─────────────────────────────────────────────────────────── Progression
progression:
  enabled: true
  # Lustre per action (any StaffAction name in lower case). Repeated actions stop paying at the daily cap.
  rewards:
    flare_resolve: 12
    flare_dismiss: 4
    flare_claim: 2
    chip: 3
    hush: 5
    eject: 5
    encase: 8
    petrify: 4
    rewind: 10
    glint_handle: 8
    echo_inspect: 1
  daily-cap: 400
  # Lustre that /sw lustre add gives also counts toward Clarity levels.
  admin-grants-count-for-level: true
  # Lustre per Lustre Shard (right-click; sneak to redeem the whole stack).
  shard-value: 25
  # Lifetime Lustre needed for Clarity I, II, III, …
  levels: [0, 120, 300, 600, 1000, 1600, 2400, 3500, 5000, 7000]
  level-rewards:
    2: {shards: 2, keepsakes: []}
    3: {shards: 3, keepsakes: [sigil_star]}
    5: {shards: 5, keepsakes: [aura_petals]}
    7: {shards: 6, keepsakes: [sigil_moon]}
    10: {shards: 10, keepsakes: [aura_starfall]}
  # Tool tiers. cost = Lustre, level = Clarity needed. The lists give tier I/II/III values.
  refinements:
    echo_lens:
      tier-2: {cost: 150, level: 2}
      tier-3: {cost: 450, level: 5}
      page-bonus: [0, 3, 7]
      cooldown-ticks: [6, 4, 2]
    timeglass:
      tier-2: {cost: 250, level: 3}
      tier-3: {cost: 700, level: 6}
      area-bonus: [0, 24, 48]
      cooldown-ticks: [100, 70, 40]
    verdict_gavel:
      tier-2: {cost: 150, level: 2}
      tier-3: {cost: 450, level: 5}
      cooldown-ticks: [10, 6, 3]
    petrify_prism:
      tier-2: {cost: 150, level: 2}
      tier-3: {cost: 450, level: 5}
      cooldown-ticks: [20, 12, 6]
    veil_lantern:
      tier-2: {cost: 120, level: 2}
      tier-3: {cost: 400, level: 4}
      cooldown-ticks: [20, 10, 4]
    flare_compass:
      tier-2: {cost: 120, level: 2}
      tier-3: {cost: 400, level: 4}
      cooldown-ticks: [20, 12, 6]
    glint_monocle:
      tier-2: {cost: 200, level: 3}
      tier-3: {cost: 600, level: 6}
      cooldown-ticks: [20, 12, 6]
  # Keepsakes: type aura (particles around you), sigil (glyph before your name in chat), shards (a Lustre Shard bundle).
  # icon = any Shardwatch model id. Aura patterns: orbit, halo, spiral, trail.
  keepsakes:
    aura_petals:
      type: aura
      name: "<pink>Petal Orbit"
      icon: icon_flare
      level: 3
      cost: 200
      pattern: orbit
      particles: ["DUST 1 0 0 0 0 #F59AC8 0.9", "DUST 1 0 0 0 0 #FBC3DD 0.7"]
      lore: ["<muted>Pink crystal petals circle you."]
    aura_tide:
      type: aura
      name: "<teal>Tide Halo"
      icon: icon_glint
      level: 4
      cost: 300
      pattern: halo
      particles: ["DUST 1 0 0 0 0 #7FE8E0 0.8"]
      lore: ["<muted>A teal halo above your head."]
    aura_prism:
      type: aura
      name: "<gradient:#F59AC8:#7FE8E0>Prism Spiral"
      icon: icon_refine
      level: 6
      cost: 500
      pattern: spiral
      particles: ["DUST_COLOR_TRANSITION 1 0 0 0 0 #F59AC8 #7FE8E0 1.0"]
      lore: ["<muted>A pink-to-teal spiral rises around you."]
    aura_starfall:
      type: aura
      name: "<ice>Starfall Trail"
      icon: icon_lustre
      level: 8
      cost: 800
      pattern: trail
      particles: ["END_ROD 1 0.2 0 0.2 0.01", "DUST 2 0.2 0 0.2 0 #B7F2FF 0.8"]
      lore: ["<muted>Stars fall where you walk."]
    sigil_heart:
      type: sigil
      name: "<pink>Heart Sigil"
      icon: icon_keepsake
      level: 2
      cost: 100
      lore: ["<muted>A crystal heart before your name."]
    sigil_star:
      type: sigil
      name: "<ice>Star Sigil"
      icon: icon_lustre
      level: 3
      cost: 150
      lore: ["<muted>A four-point star before your name."]
    sigil_moon:
      type: sigil
      name: "<teal>Moon Sigil"
      icon: icon_info
      level: 5
      cost: 250
      lore: ["<muted>A crescent moon before your name."]
    sigil_bloom:
      type: sigil
      name: "<rose>Bloom Sigil"
      icon: icon_keepsake
      level: 7
      cost: 400
      lore: ["<muted>A crystal flower before your name."]
    shard_bundle:
      type: shards
      name: "<pink>Shard Bundle"
      icon: lustre_shard
      level: 1
      cost: 100
      amount: 5
      lore: ["<muted>Five Lustre Shards to hand out as thanks."]

chat-log:
  # Commands that are never written to the chat log (passwords etc.).
  ignored-commands: [login, l, register, reg, changepassword, cp]

# ─────────────────────────────────────────────────────────── Shardscope
scope:
  # /scope opens the book view; add --chat for chat. Set false to flip that around.
  book-by-default: true
  rows-per-page: 4
  rows-per-window: 60
  chat-rows: 12

# ─────────────────────────────────────────────────────────── Effects
# Every ability, hit and pickup has a preset. Each preset has:
#   sounds:    custom sounds from the Shardwatch pack  "shardwatch:event volume pitch [delayTicks]"
#   fallback:  vanilla sounds for players without the pack (same format)
#   particles: "PARTICLE count dx dy dz speed [#color] [#color2] [size]"
#              "ITEM count dx dy dz speed shardwatch:particle_shard"  ← crystal particles drawn by the pack
fx:
  enabled: true
  # auto = custom sounds for players whose pack loaded, fallback for the rest. Also: custom, vanilla, both.
  sound-mode: auto
  hear-radius: 24
  animations: true
  # Crystal item-display animations (Encase cage, Petrify shell, halos…). Off = particles only.
  display-entities: true
  presets:
    # ── menus
    ui-open:
      sounds: ["shardwatch:ui.open 0.6 1.0"]
      fallback: ["minecraft:block.amethyst_block.resonate 0.5 1.6"]
    ui-click:
      sounds: ["shardwatch:ui.click 0.6 1.0"]
      fallback: ["minecraft:block.amethyst_block.hit 0.6 1.8"]
    ui-page:
      sounds: ["shardwatch:ui.page 0.7 1.0"]
      fallback: ["minecraft:item.book.page_turn 0.8 1.4"]
    ui-deny:
      sounds: ["shardwatch:ui.deny 0.7 1.0"]
      fallback: ["minecraft:block.amethyst_block.break 0.6 0.6"]
    ui-confirm:
      sounds: ["shardwatch:ui.confirm 0.8 1.0"]
      fallback: ["minecraft:block.amethyst_block.chime 0.8 1.8"]
    ui-back:
      sounds: ["shardwatch:ui.click 0.6 0.8"]
      fallback: ["minecraft:block.amethyst_block.step 0.8 1.2"]
    scope-open:
      sounds: ["shardwatch:ui.page 0.8 0.9", "shardwatch:ui.open 0.4 1.2 2"]
      fallback: ["minecraft:item.book.page_turn 1 1.2"]
    # ── verdicts
    verdict-chip:
      sounds: ["shardwatch:verdict.chip 1 1"]
      fallback: ["minecraft:block.amethyst_block.hit 1 1.6"]
      particles: ["ITEM 8 0.3 0.5 0.3 0.12 shardwatch:particle_shard", "DUST 10 0.4 0.6 0.4 0 #F7C6DF 1.0"]
    verdict-hush:
      sounds: ["shardwatch:verdict.hush 1 1"]
      fallback: ["minecraft:block.amethyst_cluster.place 1 0.8"]
      particles: ["ITEM 10 0.3 0.4 0.3 0.05 shardwatch:particle_spark", "DUST_COLOR_TRANSITION 14 0.3 0.3 0.3 0 #7FE8E0 #FFFFFF 1.0"]
    verdict-eject:
      sounds: ["shardwatch:verdict.eject 1 1"]
      fallback: ["minecraft:entity.illusioner.mirror_move 1 1.4"]
      particles: ["ITEM 16 0.4 0.8 0.4 0.2 shardwatch:particle_shard", "DUST 18 0.5 0.8 0.5 0 #F59AC8 1.3"]
    verdict-encase:
      sounds: ["shardwatch:verdict.encase 1 1"]
      fallback: ["minecraft:block.amethyst_block.resonate 1 0.6", "minecraft:block.glass.break 0.8 0.7 20"]
      particles: ["ITEM 24 0.5 1.0 0.5 0.1 shardwatch:particle_shard", "DUST_COLOR_TRANSITION 30 0.5 1.0 0.5 0 #D9468F #7FE8E0 1.4"]
    encase-shatter:
      sounds: ["shardwatch:verdict.release 1 0.8"]
      fallback: ["minecraft:block.glass.break 1 0.8"]
      particles: ["ITEM 40 0.6 1.0 0.6 0.3 shardwatch:particle_shard"]
    verdict-petrify:
      sounds: ["shardwatch:verdict.petrify 1 1"]
      fallback: ["minecraft:block.amethyst_block.place 1 0.5", "minecraft:entity.player.hurt_freeze 0.6 1.4 3"]
      particles: ["ITEM 14 0.4 0.9 0.4 0.05 shardwatch:particle_mote", "DUST_COLOR_TRANSITION 20 0.4 0.9 0.4 0 #B7F2FF #FFFFFF 1.2"]
    verdict-unpetrify:
      sounds: ["shardwatch:verdict.release 1 1"]
      fallback: ["minecraft:block.amethyst_cluster.break 1 1.3"]
      particles: ["ITEM 20 0.4 0.9 0.4 0.2 shardwatch:particle_mote"]
    gavel-hit:
      sounds: ["shardwatch:gavel.hit 1 1"]
      fallback: ["minecraft:block.amethyst_block.break 1 0.7", "minecraft:entity.iron_golem.hurt 0.4 1.8"]
      particles: ["ITEM 12 0.2 0.2 0.2 0.25 shardwatch:particle_shard", "DUST 10 0.3 0.3 0.3 0 #F59AC8 1.3"]
    # ── flares
    flare-send:
      sounds: ["shardwatch:flare.send 1 1"]
      fallback: ["minecraft:block.amethyst_block.chime 1 1.4", "minecraft:entity.firework_rocket.launch 0.4 1.6 2"]
      particles: ["ITEM 8 0.2 0.4 0.2 0.15 shardwatch:particle_spark"]
    flare-alert:
      sounds: ["shardwatch:flare.alert 0.8 1"]
      fallback: ["minecraft:block.note_block.bell 0.8 1.6", "minecraft:block.note_block.bell 0.6 2.0 4"]
    flare-claim:
      sounds: ["shardwatch:flare.claim 1 1"]
      fallback: ["minecraft:block.amethyst_block.hit 1 1.2"]
    flare-resolve:
      sounds: ["shardwatch:flare.resolve 1 1"]
      fallback: ["minecraft:entity.player.levelup 0.5 1.8"]
      particles: ["ITEM 10 0.3 0.5 0.3 0.1 shardwatch:particle_spark"]
    flare-dismiss:
      sounds: ["shardwatch:ui.deny 0.8 1.2"]
      fallback: ["minecraft:block.amethyst_block.step 1 0.8"]
    # ── echoes & rewind
    echo-inspect:
      sounds: ["shardwatch:echo.inspect 0.8 1"]
      fallback: ["minecraft:block.amethyst_block.chime 0.7 1.8"]
      particles: ["ITEM 4 0.25 0.25 0.25 0.02 shardwatch:particle_mote", "DUST 6 0.3 0.3 0.3 0 #7FE8E0 0.8"]
    lens-focus:
      sounds: ["shardwatch:monocle.focus 0.8 1.2"]
      fallback: ["minecraft:item.spyglass.use 0.8 1.6"]
      particles: ["DUST 10 0.35 0.35 0.35 0 #7FE8E0 0.9"]
    timeglass-mark:
      sounds: ["shardwatch:rewind.tick 1 1"]
      fallback: ["minecraft:block.amethyst_cluster.place 0.8 1.5"]
      particles: ["ITEM 6 0.2 0.2 0.2 0.05 shardwatch:particle_spark"]
    rewind-start:
      sounds: ["shardwatch:rewind.start 1 1"]
      fallback: ["minecraft:block.beacon.power_select 0.7 1.6"]
    rewind-block:
      sounds: ["shardwatch:rewind.tick 0.25 1.2"]
      fallback: []
      particles: ["ITEM 2 0.3 0.3 0.3 0.02 shardwatch:particle_mote", "DUST_COLOR_TRANSITION 3 0.3 0.3 0.3 0 #7FE8E0 #F59AC8 0.9"]
    rewind-done:
      sounds: ["shardwatch:rewind.done 1 1"]
      fallback: ["minecraft:block.beacon.activate 0.7 1.6", "minecraft:block.amethyst_block.resonate 0.8 1.4 4"]
      particles: ["ITEM 20 0.5 0.8 0.5 0.1 shardwatch:particle_spark"]
    rewind-undo:
      sounds: ["shardwatch:rewind.start 0.8 1.3"]
      fallback: ["minecraft:block.beacon.deactivate 0.7 1.6"]
    # ── glint, veil, travel
    glint-alert:
      sounds: ["shardwatch:glint.alert 0.8 1"]
      fallback: ["minecraft:block.note_block.pling 0.8 2.0", "minecraft:block.amethyst_block.chime 0.8 0.8 3"]
    monocle-focus:
      sounds: ["shardwatch:monocle.focus 1 1"]
      fallback: ["minecraft:item.spyglass.use 1 1.2"]
    veil-on:
      sounds: ["shardwatch:veil.on 1 1"]
      fallback: ["minecraft:entity.illusioner.cast_spell 0.8 1.4"]
      particles: ["ITEM 12 0.4 0.9 0.4 0.08 shardwatch:particle_shard", "DUST_COLOR_TRANSITION 20 0.4 0.9 0.4 0 #F59AC8 #7FE8E0 1.2"]
    veil-off:
      sounds: ["shardwatch:veil.off 1 1"]
      fallback: ["minecraft:entity.illusioner.prepare_mirror 0.8 1.4"]
      particles: ["ITEM 12 0.4 0.9 0.4 0.08 shardwatch:particle_spark", "DUST_COLOR_TRANSITION 20 0.4 0.9 0.4 0 #7FE8E0 #F59AC8 1.2"]
    warp-out:
      sounds: ["shardwatch:compass.warp 0.8 1.2"]
      fallback: ["minecraft:entity.enderman.teleport 0.6 1.6"]
      particles: ["ITEM 10 0.3 0.8 0.3 0.1 shardwatch:particle_shard"]
    warp-in:
      sounds: ["shardwatch:compass.warp 0.8 0.9"]
      fallback: ["minecraft:block.amethyst_block.chime 1 1.6"]
      particles: ["ITEM 10 0.3 0.8 0.3 0.1 shardwatch:particle_spark"]
