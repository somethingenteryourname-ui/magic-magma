    hover: "<white><player></white> <muted>(<kind>) <date><newline><white><message><newline><pink>Click: only this player"
  verdicts:
    line1: "<#8A1F57>⚖</#8A1F57> <#2F3640><name_s></#2F3640> <#7C858F><ago_s>"
    line2: "  <type_color><type_name></type_color> <#4A525C>#<id>"
    hover: "<type_color><b><type_name></b> #<id></type_color><newline><muted>Target:</muted> <player><newline><muted>By:</muted> <actor><newline><muted>Length:</muted> <duration> · <status><newline><white><reason><newline><pink>Click to open Ledger"
  flares:
    line1: "<#8A1F57>✦</#8A1F57> <#2F3640><name_s></#2F3640> <#7C858F><ago_s>"
    line2: "  <#4A525C>#<id> <status>"
    hover: "<pink>Flare #<id></pink> <muted>(<status>)<newline><muted>From:</muted> <reporter><newline><muted>Category:</muted> <category><newline><white><reason><newline><muted>Handler:</muted> <handler><newline><pink>Click to view"
  glint:
    line1: "<#0E6F6A>◈</#0E6F6A> <#2F3640><name_s></#2F3640> <#7C858F><ago_s>"
    line2: "  <#4A525C><ore> <#8A1F57><score>"
    hover: "<teal>Glint</teal> <muted><ago><newline><white><player></white> <muted>found <ore><newline><muted>Score:</muted> <score><newline><muted><world> <x> <y> <z><newline><muted>Handled by <handled><newline><pink>Click to teleport"
  staff:
    line1: "<#0E6F6A>☰</#0E6F6A> <#2F3640><name_s></#2F3640> <#7C858F><ago_s>"
