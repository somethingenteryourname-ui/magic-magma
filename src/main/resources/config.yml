# ---------------------------------------------------------
# Presets: /ctrim preset <name>   or   /ctrim give <player> <name>
#
#  pattern:  NEW: nova circuit scales blaze rune fracture spiral aurora lightning
#            vines constellation honeycomb chains crystal feathers web thorns
#            tiger leopard camo heartbeat matrix sun moon skull hearts plaid ripple
#            vanilla: bolt coast dune eye flow host raiser rib sentry shaper
#            silence snout spire tide vex ward wayfinder wild  (or none)
#  material: any custom material above, or vanilla: amethyst copper diamond
#            emerald gold iron lapis netherite quartz redstone resin
#  colors:   1 to 8 colors for the particles, names or hex (#FF00AA)
#  trail / aura-particle: see /ctrim options
#  trail-shape: stream comet double spiral sparks cloud footsteps
#  aura:     none ring double_ring halo helix double_helix orbit
#            pulse crown tornado wings fireflies
#  style:    liquid, particles or both (optional, default-style is used if missing)
# ---------------------------------------------------------
