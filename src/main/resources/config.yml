# =========================================================
#  CustomTrims config
#  After editing, run /ctrim reload
# =========================================================

# How often particles are drawn, in ticks (20 ticks = 1 second).
# 1 = smoothest, 2 = good balance, 3-4 = lighter on big servers.
tick-interval: 2

# How many armor pieces need a custom trim before effects show (1-4).
min-armor-pieces: 1

# Only draw the trail while the player is moving.
trail-only-when-moving: true

# Hide effects for players who have the Invisibility potion effect.
hide-when-invisible: true

# Hide effects while sneaking.
hide-when-sneaking: false

# How trails and auras look when a trim doesn't say:
#   liquid    = flowing, glossy liquid that wraps around you (needs the resource pack)
#   particles = classic particles
#   both      = liquid with particles on top
# Players can change theirs with /ctrim style
default-style: liquid

liquid:
  # Make the liquid glow at full brightness, even in the dark.
  glow: true
  # How often (in ticks) the colors flow one step around the ring. Lower = faster.
  color-flow-ticks: 3
  # Let players see their own liquid aura (looking down at the ring, etc.).
  show-own: true

# Limits for /ctrim size and /ctrim density
max-size: 3.0
max-density: 3.0

# ---------------------------------------------------------
# Resource pack (needed so players can SEE the new trims and materials)
# The plugin builds it for you: plugins/CustomTrims/CustomTrims-ResourcePack.zip
# ---------------------------------------------------------
resource-pack:
  enabled: true
  # The plugin hosts the pack itself on this port. Friends outside your
  # network need this port forwarded, just like the Minecraft port.
  port: 8164
  # The address players use to reach the server. Leave blank to use
  # whatever address each player typed to join.
  public-address: ""
  # OR: upload CustomTrims-ResourcePack.zip somewhere yourself (for example
  # mc-packs.net) and paste the direct download link here. Then the port
  # above is not used. Re-upload it whenever you add a new material.
  url: ""
  force: false
  prompt: "This adds the custom armor trims!"

# ---------------------------------------------------------
# Custom trim materials = new trim colors ON the armor itself.
# Give 1 color for a solid trim, or 2-8 colors to blend them from
# the top of the armor down to the boots.
# You can also add one in game: /ctrim newmaterial <name> <colors...>
# After adding a new one, RESTART the server once.
# Don't delete a material players are still wearing.
# ---------------------------------------------------------
custom-materials:
  fire: ["#FFF27A", "#FF9A1F", "#FF3D00", "#9B0000"]
  ice: ["#FFFFFF", "#BFF4FF", "#6FD6FF", "#2E7FD9"]
  toxic: ["#E8FF6A", "#7CFF3A", "#1FAA3A", "#0B4D1E"]
  galaxy: ["#FF2DD9", "#8B2DFF", "#2D5BFF", "#3DF5FF"]
  sunset: ["#FFD36A", "#FF7B54", "#E0457B", "#6A2C70"]
  ocean: ["#B6FFF4", "#3DF5FF", "#0077FF", "#14215E"]
  sakura: ["#FFF0F6", "#FFB7D5", "#FF5FA2", "#B03A74"]
  rainbow: ["#FF2D2D", "#FF8C1A", "#FFF23D", "#7CFF3A", "#3DF5FF", "#8B2DFF"]
  void: ["#B000FF", "#6A00B8", "#2B0040", "#0A0012"]
